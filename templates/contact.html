{% extends "base.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-2xl">
    <h2 class="text-4xl font-bold text-gray-800 mb-6 text-center">Get in Touch</h2>
    <p class="text-gray-600 mb-6 text-center">
        Have a question or feedback? Please reach out to us!
    </p>
    
    <!-- This is a dummy form, as the backend logic to handle emails is not implemented -->
    <form action="#" method="POST">
        <div class="mb-4">
            <label for="name" class="block text-gray-700 font-medium mb-2">Your Name</label>
            <input type="text" id="name" name="name" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="mb-4">
            <label for="email" class="block text-gray-700 font-medium mb-2">Your Email</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="mb-6">
            <label for="message" class="block text-gray-700 font-medium mb-2">Message</label>
            <textarea id="message" name="message" rows="5" required
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-y"></textarea>
        </div>
        <button type="submit" disabled
                class="w-full bg-gray-400 text-white font-semibold py-3 rounded-xl shadow-lg cursor-not-allowed">
            Send Message (Dummy: Not Implemented)
        </button>
    </form>
</div>
{% endblock %}
