<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    </head>
<body style="margin: 0; padding-top: 80px; background-color: black; color: white;">
    <Header>
        <div class="Logo">
            <a href ="{{ url_for('index') }}">
                <h1>[College Blog]</h1>
            </a>
        </div>

        <nav class="main-nav">
            <input type="checkbox" id="nav-toggle" class="nav-toggle">

            <label for="nav-toggle" class="nav-toggle-label">
                <span class="Line"></span>
                <span class="Line"></span>
                <span class="Line"></span>
            </label>
            <ul class="nav-links">
                <li><a href="{{ url_for('about') }}">[About]</a></li>
                <li><a href="{{ url_for('contact') }}">[Contact]</a></li>
                <li><a href="{{ url_for('view_posts') }}">[View Posts]</a></li>
                <li><a href="{{ url_for('create_post') }}">[Create a Post]</a></li>
            </ul>
        </nav>
    </Header>
<main>

    <form method="POST" action="{{ url_for('create_post') }}">
        <section class="Post-Title">
            <Label for="title">[Post Title]:</Label>
            <input type="text" id="title" name="title" required>
        </section>

        <section class="Post-Content">
            <label for="content">[Post Content]:</label>
        </section>
            <textarea id="content" name="content" rows="30" cols="100" required></textarea>

        <section class="Submit-Button">
            <button type="submit">Submit Post</button>
        </section>
    </form>
</main>
<footer>        
    <p>&copy; 2025 College Blog. All rights reserved.</p>
    <p>If issues are found please visit contact page</p>
</footer>

</html>
